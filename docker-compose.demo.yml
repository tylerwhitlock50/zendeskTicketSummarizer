# Self-contained DEMO stack: the portal with a fake Zendesk and its own
# throwaway database. Nothing is sent to Zendesk or any customer, and the
# real .env (Zendesk/OpenAI credentials) is never read.
#
# Start it with ./run_demo.sh, which writes .env.demo (passwords) and sets up
# the firewall. Only the web port is published; the database is reachable
# from the app container only (Docker-published ports bypass ufw, so nothing
# else is published on purpose).
services:
  demo-db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?run ./run_demo.sh}
    tmpfs:
      - /var/lib/postgresql/data   # gone when the stack stops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  demo-app:
    build: .
    entrypoint: ["python", "tests/demo_server.py"]
    volumes:
      - ./tests:/app/tests:ro
    environment:
      DEMO_DATABASE_URL: postgresql://postgres:${DEMO_DB_PASSWORD}@demo-db:5432/postgres
      DEMO_PASSWORD: ${DEMO_PASSWORD:?run ./run_demo.sh}
      FLASK_SECRET_KEY: ${DEMO_SECRET_KEY:?run ./run_demo.sh}
      DEMO_HOST: 0.0.0.0
      DEMO_PORT: "5000"
    ports:
      - "${DEMO_PUBLIC_PORT:-80}:5000"
    depends_on:
      - demo-db
    restart: unless-stopped
