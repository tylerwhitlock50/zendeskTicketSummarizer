# Dev overlay: adds a local Postgres for the RTM tracker.
# Run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  zendesk-ticket-print:
    environment:
      RTM_DATABASE_URL: postgresql://postgres:rtm_dev@postgres:5432/rtm_dev
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rtm_dev
      POSTGRES_PASSWORD: rtm_dev
    ports:
      - "5433:5432"
    volumes:
      - rtm_pgdata:/var/lib/postgresql/data

volumes:
  rtm_pgdata:
