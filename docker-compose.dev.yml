# Dev overlay: adds a local Postgres for the scan portal.
# Run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  zendesk-ticket-print:
    environment:
      DATABASE_URL: postgresql://postgres:portal_dev@postgres:5432/portal_dev
    depends_on:
      - postgres

  delivery-checker:
    environment:
      DATABASE_URL: postgresql://postgres:portal_dev@postgres:5432/portal_dev
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: portal_dev
      POSTGRES_PASSWORD: portal_dev
    ports:
      - "5433:5432"
    volumes:
      - portal_pgdata:/var/lib/postgresql/data

volumes:
  portal_pgdata:
